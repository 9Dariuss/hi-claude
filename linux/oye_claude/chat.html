<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
:root {
  --accent: #3584e4;
  --bg: #ffffff;
  --fg: #1e1e22;
  --muted: #6e6e75;
  --card: #f4f4f6;
  --border: #e2e2e6;
  --code-bg: #f6f6f8;
  --add: #e6f6ea; --add-fg: #1a6b35;
  --del: #fdeaea; --del-fg: #a51d2d;
  --error: #c01c28;
}
html.dark {
  --bg: #1d1d20;
  --fg: #f0f0f2;
  --muted: #9a9aa2;
  --card: #2a2a2e;
  --border: #38383d;
  --code-bg: #26262a;
  --add: #1f3a28; --add-fg: #8ff0a4;
  --del: #432226; --del-fg: #ff9a9a;
  --error: #ff7b7b;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
body {
  font: 16px/1.6 "Adwaita Sans", Cantarell, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}
#chat { max-width: 780px; margin: 0 auto; padding: 24px 20px 40px; }

/* ---- estado vacío */
#empty { text-align: center; padding-top: 18vh; color: var(--muted); }
#empty .logo { font-size: 56px; line-height: 1; }
#empty h1 { color: var(--fg); font-size: 26px; font-weight: 700; margin: 16px 0 6px; }
#empty p { margin: 4px 0; }
#empty kbd {
  font: 13px "Adwaita Mono", monospace; padding: 2px 7px; border-radius: 6px;
  background: var(--card); border: 1px solid var(--border);
}
body.has-messages #empty { display: none; }

/* ---- mensajes */
.msg { margin: 18px 0; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
.user { display: flex; justify-content: flex-end; }
.user .bubble {
  background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 18px 18px 4px 18px;
  max-width: 80%; white-space: pre-wrap; word-wrap: break-word;
}
.user .bubble .via { display: block; font-size: 12px; opacity: .75; }
.assistant { word-wrap: break-word; }
.assistant > :first-child { margin-top: 0; }
.assistant > :last-child { margin-bottom: 0; }
.assistant h1, .assistant h2, .assistant h3 { line-height: 1.3; margin: 1.2em 0 .5em; }
.assistant h1 { font-size: 1.45em; } .assistant h2 { font-size: 1.25em; } .assistant h3 { font-size: 1.1em; }
.assistant a { color: var(--accent); }
.assistant blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
.assistant table { border-collapse: collapse; margin: 12px 0; font-size: 15px; display: block; overflow-x: auto; }
.assistant th, .assistant td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.assistant th { background: var(--card); }
code { font: .9em "Adwaita Mono", "Source Code Pro", monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
pre { font: 14px/1.5 "Adwaita Mono", "Source Code Pro", monospace; background: var(--code-bg); border: 1px solid var(--border);
      padding: 12px 14px; border-radius: 10px; overflow-x: auto; position: relative; white-space: pre; }
pre code { background: none; padding: 0; font-size: inherit; }
pre .lang { position: absolute; top: 4px; right: 10px; font-size: 11px; color: var(--muted); font-family: sans-serif; }
.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---- herramientas */
details.tool {
  margin: 8px 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  font-size: 14.5px;
}
details.tool summary {
  list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: center;
}
details.tool summary::-webkit-details-marker { display: none; }
details.tool summary .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.tool summary .status { color: var(--muted); font-size: 13px; }
details.tool .status.ok::before { content: "✓"; color: #2ec27e; font-weight: 700; }
details.tool .status.err::before { content: "✗"; color: var(--error); font-weight: 700; }
details.tool .status.run::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--muted); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
details.tool .body { padding: 0 12px 10px; }
details.tool .body pre { margin: 6px 0; max-height: 320px; overflow: auto; font-size: 13px; }
pre.diff-add { background: var(--add); color: var(--add-fg); border-color: transparent; }
pre.diff-del { background: var(--del); color: var(--del-fg); border-color: transparent; }
pre.result.err { color: var(--error); }
ul.todos { list-style: none; padding: 0; margin: 4px 0; }
.todos-inline { margin: 8px 0; }

/* ---- notas y pie */
.note { text-align: center; color: var(--muted); font-size: 13px; margin: 14px 0; }
.note.error { color: var(--error); }
.done { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
#thinking { display: none; gap: 5px; padding: 6px 0; }
body.busy #thinking { display: flex; }
#thinking span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
#thinking span:nth-child(2) { animation-delay: .15s; } #thinking span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

/*PYGMENTS*/
</style>
</head>
<body>
<div id="chat">
  <div id="empty">
    <div class="logo">🎙️</div>
    <h1>¿En qué te ayudo?</h1>
    <p id="empty-project"></p>
    <p>Escribe abajo o pulsa <kbd>Super</kbd> + <kbd>Alt</kbd> + <kbd>C</kbd> para hablar.</p>
  </div>
  <div id="messages"></div>
  <div id="thinking"><span></span><span></span><span></span></div>
</div>
<script>
const $messages = document.getElementById("messages");
const byId = {};

function nearBottom() {
  return window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
}
function stick(wasNear) { if (wasNear) window.scrollTo(0, document.body.scrollHeight); }
function add(el) {
  const near = nearBottom();
  $messages.appendChild(el);
  document.body.classList.add("has-messages");
  stick(near);
  return el;
}
function div(cls, html) { const d = document.createElement("div"); d.className = cls; if (html) d.innerHTML = html; return d; }

function addUser(text, viaVoice) {
  const wrap = div("msg user"), b = div("bubble");
  b.textContent = text;
  if (viaVoice) { const v = document.createElement("span"); v.className = "via"; v.textContent = "🎙 por voz"; b.prepend(v); }
  wrap.appendChild(b);
  add(wrap);
  window.scrollTo(0, document.body.scrollHeight);
}
function setAssistant(id, html, streaming) {
  const near = nearBottom();
  let el = byId[id];
  if (!el) { el = byId[id] = add(div("msg assistant")); }
  el.innerHTML = html;
  el.classList.toggle("streaming", !!streaming);
  stick(near);
}
function addTool(id, icon, title, detail) {
  const d = document.createElement("details");
  d.className = "msg tool";
  d.innerHTML = `<summary><span>${icon}</span><span class="title">${title}</span><span class="status run"></span></summary>` +
                `<div class="body">${detail}</div>`;
  byId[id] = add(d);
}
function setToolResult(id, ok, html) {
  const d = byId[id]; if (!d) return;
  const s = d.querySelector(".status");
  s.className = "status " + (ok ? "ok" : "err");
  if (html) d.querySelector(".body").insertAdjacentHTML("beforeend", html);
  if (!ok) d.open = true;
}
function finishRunningTools() {
  document.querySelectorAll(".status.run").forEach(s => s.className = "status");
}
function addNote(html, kind) { add(div("note " + (kind || ""), html)); }
function addDone(text) { add(div("done", text)); }
function setBusy(b) { document.body.classList.toggle("busy", b); if (b) stick(nearBottom()); }
function setDark(d) { document.documentElement.classList.toggle("dark", d); }
function setAccent(c) { document.documentElement.style.setProperty("--accent", c); }
function setProject(t) { document.getElementById("empty-project").textContent = t; }
function clearChat() {
  $messages.innerHTML = "";
  for (const k in byId) delete byId[k];
  document.body.classList.remove("has-messages", "busy");
}
</script>
</body>
</html>
