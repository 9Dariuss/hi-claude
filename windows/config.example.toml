# Configuración de Hi Claude!  →  %APPDATA%\hi-claude\config.toml
# Todas las claves son opcionales; estos son los valores por defecto.
# Tras cambiarla, cierra y vuelve a abrir la app. El color, el tema y las opciones
# de voz más comunes se cambian en la propia app: menú ⋮ → Preferencias.

# --- Claude
claude_path = ""          # vacío = `claude` del PATH o, si no hay, el que trae la app
default_project = "~"     # carpeta de la primera vez (luego recuerda la última)

# --- Atajos globales (funcionan con la app cerrada). Tras cambiarlos, cierra sesión en
# Windows y vuelve a entrar, o ejecuta de nuevo el instalador.
# Win+C (Copilot) y Ctrl+Win+C (filtros de color) los reserva Windows.
hotkey_open = "Win+Alt+C"
hotkey_voice = "Win+Alt+V"
hotkey_snip = "Win+Alt+X"

# --- Voz
# Micrófono: nombre o índice (lista: hi-claude --list-mics). Comentado = el predeterminado de Windows.
# input_device = "Razer Seiren Mini"

# Modelo de faster-whisper: tiny, base, small, medium, large-v3-turbo
# Con GPU NVIDIA, "large-v3-turbo" entiende mejor y sigue siendo rápido (+1,6 GB de descarga).
model = "small"
language = "es"
device = "auto"           # "auto" = GPU NVIDIA si hay, si no CPU; o "cuda" / "cpu"
compute_type = "auto"     # "auto" = int8_float16 en GPU, int8 en CPU

end_silence_ms = 1300     # pausa que da por terminada la orden
start_timeout_s = 8.0     # si no empiezas a hablar en este tiempo, deja de escuchar
max_utterance_s = 60.0

# Sensibilidad: si corta antes de tiempo con ruido, sube vad_margin_db; si no te oye, bájalo.
vad_margin_db = 12.0
vad_min_dbfs = -50.0
